name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@v5
      - name: Restore processed photographs
        id: photo-cache
        uses: actions/cache/restore@v4
        with:
          path: .photo-cache
          key: ${{ runner.os }}-photos-v1-${{ hashFiles('package-lock.json', 'scripts/process-photo.mjs', 'scripts/photo-cache.mjs') }}-${{ hashFiles('content/photos/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-photos-v1-${{ hashFiles('package-lock.json', 'scripts/process-photo.mjs', 'scripts/photo-cache.mjs') }}-${{ hashFiles('content/photos/**') }}-
            ${{ runner.os }}-photos-v1-${{ hashFiles('package-lock.json', 'scripts/process-photo.mjs', 'scripts/photo-cache.mjs') }}-
      - name: Build portfolio
        id: build
        run: npm run build
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - name: Save newly processed photographs
        if: steps.build.outputs.processed != '' && steps.build.outputs.processed != '0'
        uses: actions/cache/save@v4
        with:
          path: .photo-cache
          key: ${{ steps.photo-cache.outputs.cache-primary-key }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
